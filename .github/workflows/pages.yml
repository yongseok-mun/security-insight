name: Refresh and deploy Security Insight

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-insight-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .feed-cache
          key: security-insight-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: security-insight-v1-
      - name: Refresh public feeds
        run: |
          if test -s .feed-cache/data.json; then
            cp .feed-cache/data.json data.json
          fi
          python3 collect.py
          mkdir -p .feed-cache _site
          cp data.json .feed-cache/data.json
          cp index.html style.css app.js data.json _site/
      - uses: actions/cache/save@v4
        with:
          path: .feed-cache
          key: security-insight-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
