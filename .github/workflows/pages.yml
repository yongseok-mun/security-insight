name: Refresh and deploy Security Insight

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-insight-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .feed-cache
          key: security-insight-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: security-insight-v1-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the translation model cache
        id: translation-model
        run: |
          python -B - <<'PY' >> "$GITHUB_OUTPUT"
          from translate_advisories import MODEL, REVISION
          print(f"key=security-insight-model-{MODEL.replace('/', '--')}-{REVISION}")
          print(f"path=~/.cache/huggingface/hub/models--{MODEL.replace('/', '--')}")
          PY
      - uses: actions/cache@v4
        with:
          path: ${{ steps.translation-model.outputs.path }}
          key: ${{ steps.translation-model.outputs.key }}
      - name: Install Korean translation dependencies
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
          python -m pip install transformers==4.57.1 sentencepiece==0.2.1 sacremoses==0.1.1
      - name: Refresh public feeds
        run: |
          if test -s .feed-cache/data.json; then
            cp .feed-cache/data.json data.json
          fi
          python3 collect.py
      - name: Prepare Korean advisory text
        continue-on-error: true
        timeout-minutes: 7
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: '45'
        run: python3 translate_advisories.py
      - name: Package Pages snapshot
        run: |
          mkdir -p .feed-cache _site
          cp data.json .feed-cache/data.json
          cp debian-packages.json .feed-cache/debian-packages.json
          cp cve-archive.json .feed-cache/cve-archive.json
          cp index.html style.css app.js data.json debian-packages.json cve-archive.json _site/
      - uses: actions/cache/save@v4
        with:
          path: .feed-cache
          key: security-insight-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
