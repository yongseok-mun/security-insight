<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CVE 우선순위, 영향 범위, 안전한 점검과 출처를 한 화면에서 확인하는 보안 인텔리전스 대시보드">
<title>Security Insight</title>
<link rel="stylesheet" href="style.css?v=workflow-19">
<style>
  .brand-text { display: flex; flex-direction: column; line-height: 1.3; }
  .brand-text small { color: var(--muted); font-size: 11px; font-weight: 500; }
</style>
<script src="app.js?v=workflow-19" defer></script>
</head>
<body>
<header class="site-header"><div class="header-content">
  <div class="brand"><span data-icon="shield"></span><span class="brand-text"><span>Security Insight</span><small>정보보안점검팀</small></span></div>
  <nav aria-label="보안 인텔리전스">
    <button data-page="home" aria-current="page"><span data-icon="chart"></span>브리핑</button>
    <button data-page="cve"><span data-icon="shield"></span>주요취약점공지</button>
    <button data-page="news"><span data-icon="news"></span>보안 뉴스</button>
    <button data-page="issues"><span data-icon="flame"></span>핵심 이슈</button>
    <button data-page="korea"><span data-icon="chart"></span>국내 동향</button>
    <button data-page="dark"><span data-icon="user"></span>다크웹 보도</button>
  </nav>
</div></header>
<main>
  <div class="status-bar">
    <div class="update-times">
      <span>마지막 게시 <time id="freshness">불러오는 중</time></span>
      <span>다음 수집 예정 <time id="next-update">—</time> <span id="countdown" role="timer">—</span></span>
    </div>
    <div class="status-actions">
      <button class="utility refresh" id="refresh-data" type="button">새 데이터 확인</button>
      <button class="utility" id="open-email" type="button" disabled>HTML 메일 작성</button>
    </div>
    <div class="update-progress" aria-hidden="true"><span id="update-progress"></span></div>
    <p id="refresh-note" role="status"></p>
    <div id="source-alert" class="source-alert" hidden></div>
  </div>
  <section class="priority" id="priority" aria-labelledby="priority-title" hidden>
    <h1 id="priority-title">오늘 먼저 확인할 항목</h1>
    <ol class="priority-list" id="priority-list"></ol>
    <section id="priority-inspector" class="inspector" aria-label="우선 확인 CVE 상세" hidden></section>
  </section>
  <section id="workspace" aria-labelledby="page-title">
    <header class="page-heading">
      <h2 id="page-title">보안 브리핑</h2>
    </header>
    <section id="overview" class="overview" aria-label="오늘의 보안 동향"></section>
    <div id="cve-view" hidden>
      <div id="cve-link-status" class="source-alert" hidden></div>
      <div class="cve-toolbar">
        <div class="presets" role="group" aria-label="CVE 보기">
          <button data-view="latest" aria-pressed="true">최신</button>
          <button data-view="critical" aria-pressed="false">치명적</button>
          <button data-view="kev" aria-pressed="false">KEV</button>
          <button data-view="epss" aria-pressed="false">EPSS</button>
          <button data-view="watch" aria-pressed="false">관심 제품</button>
          <button data-view="recheck" aria-pressed="false">재검토 필요</button>
        </div>
        <form id="filters" aria-label="CVE 검색 및 필터">
          <label class="search"><span data-icon="search"></span><input id="query" type="search" aria-label="CVE 검색" placeholder="CVE ID 또는 제품 검색"></label>
          <select id="product" aria-label="제품"><option value="">모든 제품</option></select>
        </form>
      </div>
      <section class="results" aria-label="CVE 목록">
        <ul id="rows" class="cve-list"></ul>
        <footer id="count" aria-live="polite"></footer>
      </section>
      <section class="inspector" id="inspector" aria-label="선택한 CVE 상세" hidden></section>
    </div>
    <section class="panel feed" id="feed" hidden></section>
  </section>
  <details class="source-status" id="source-status"><summary>데이터 수집 상태</summary><ul id="source-status-list"></ul><p>이 서비스는 NVD 데이터를 사용하며 NVD의 보증이나 인증을 받지 않았습니다.</p></details>
</main>
<dialog id="guide" aria-labelledby="guide-title">
  <form method="dialog" class="close"><button aria-label="닫기">×</button></form>
  <div id="guide-content"></div>
</dialog>
<dialog id="advisory-dialog" aria-labelledby="advisory-title">
  <form method="dialog" class="close"><button aria-label="닫기">×</button></form>
  <h2 id="advisory-title">보안공지문 생성</h2>
  <p>사내 정보와 본문을 편집한 뒤 복사하거나 HTML로 내려받으세요.</p>
  <div class="advisory-metadata">
    <label>사내 영향 여부 <select name="internalImpact">
      <option value="">선택 안 함</option><option>확인 중</option><option>영향 있음</option><option>영향 없음</option>
    </select></label>
    <label>조치 기한 <input name="dueDate" type="date"></label>
    <label>담당 부서 <input name="owner" maxlength="120" placeholder="예: 인프라운영팀"></label>
  </div>
  <div class="advisory-options">
    <label hidden><input type="checkbox" name="comparison"> 조치 완료 이후 변경 내용 포함</label>
    <label hidden><input type="checkbox" name="version"> 이번 설치 버전 대조 결과 포함</label>
  </div>
  <label for="advisory-preview">보안공지문 초안</label>
  <textarea id="advisory-preview" rows="12"></textarea>
  <div class="actions advisory-actions">
    <button type="button" class="accent" data-copy-advisory>공지문 복사</button>
    <button type="button" class="outline" data-export-advisory>Outlook용 HTML 다운로드</button>
    <button type="button" class="outline" data-translate-advisory hidden>상세 원문 한국어 번역</button>
    <span role="status" data-copy-status></span>
    <span role="status" data-translation-status></span>
  </div>
  <textarea data-copy-fallback aria-label="복사할 최종 공지문" rows="5" readonly hidden></textarea>
</dialog>
<dialog id="email-dialog" aria-labelledby="email-title">
  <form method="dialog" class="close"><button aria-label="닫기">×</button></form>
  <h2 id="email-title">HTML 메일 작성</h2>
  <p id="email-scope"></p>
  <form id="email-form">
    <label for="email-address">받는 사람</label>
    <input id="email-address" type="email" required maxlength="254" autocomplete="email" placeholder="name@example.com">
    <button type="submit" class="utility">메일 초안 다운로드</button>
  </form>
  <p class="feed-note">받는 사람을 입력하면 HTML 메일 초안 파일을 내려받습니다. 메일 앱에서 열고 발송하세요.</p>
  <iframe id="email-preview" title="메일 미리보기" sandbox=""></iframe>
</dialog>
</body>
</html>
