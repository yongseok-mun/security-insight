<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CVE 우선순위, 영향 범위, 안전한 점검과 출처를 한 화면에서 확인하는 보안 인텔리전스 대시보드">
<title>Security Insight</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<aside class="sidebar">
  <div class="brand"><span data-icon="shield"></span><span>Security<br>Insight</span></div>
  <nav aria-label="보안 인텔리전스">
    <button data-page="home" aria-current="page"><span data-icon="chart"></span>브리핑</button>
    <button data-page="news"><span data-icon="news"></span>보안 뉴스</button>
    <button data-page="issues"><span data-icon="flame"></span>핵심 이슈</button>
    <button data-page="korea"><span data-icon="chart"></span>국내 동향</button>
    <button data-page="cve"><span data-icon="shield"></span>CVE</button>
    <button data-page="dark"><span data-icon="user"></span>다크웹 보도</button>
  </nav>
</aside>
<main>
  <section class="priority" id="priority" aria-labelledby="priority-title" hidden>
    <h1 id="priority-title">오늘 먼저 확인할 항목</h1>
    <div class="priority-content">
      <div class="priority-copy"><span id="priority-id"></span><h2 id="priority-name"></h2><p id="priority-reason"></p></div>
      <div class="hero-metrics"><div>CVSS<strong id="hero-cvss"></strong></div><div>EPSS<strong id="hero-epss"></strong></div></div>
      <div class="actions"><button class="accent" id="top-check"><span data-icon="shield"></span>안전한 점검</button><button class="outline" id="top-source"><span data-icon="link"></span>출처 확인</button></div>
    </div>
  </section>
  <section id="workspace" aria-labelledby="page-title">
    <header class="page-heading">
      <h2 id="page-title">보안 브리핑</h2><time id="freshness" aria-live="polite">수집 데이터 불러오는 중</time>
    </header>
    <section id="overview" class="overview" aria-label="오늘의 보안 동향"></section>
    <div id="cve-view" hidden>
      <form id="filters" aria-label="CVE 검색 및 필터">
        <label class="search"><span data-icon="search"></span><input id="query" type="search" aria-label="CVE 검색" placeholder="CVE ID, 제품 또는 키워드 검색"></label>
        <label class="kev-control"><input id="kev" type="checkbox">KEV 등재만 보기</label>
        <select id="product" aria-label="제품"><option value="">모든 제품</option></select>
      </form>
      <div class="workspace-grid">
        <section class="panel results" aria-label="CVE 목록">
          <table>
            <thead><tr><th scope="col">취약점</th><th scope="col"><button data-sort="cvss">CVSS <span></span></button></th><th scope="col"><button data-sort="epss">EPSS <span></span></button></th><th scope="col"><button data-sort="kev">KEV <span></span></button></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <footer id="count" aria-live="polite"></footer>
        </section>
        <section class="panel inspector" id="inspector" aria-label="선택한 CVE 상세"></section>
      </div>
    </div>
    <section class="panel feed" id="feed" hidden></section>
  </section>
  <details class="source-status"><summary>데이터 수집 상태</summary><ul id="source-status-list"></ul><p>이 서비스는 NVD 데이터를 사용하며 NVD의 보증이나 인증을 받지 않았습니다.</p></details>
</main>
<dialog id="guide" aria-labelledby="guide-title">
  <form method="dialog" class="close"><button aria-label="닫기">×</button></form>
  <div id="guide-content"></div>
</dialog>
</body>
</html>
